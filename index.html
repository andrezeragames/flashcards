<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashCards de Curiosidades</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🧠 FlashCards de Curiosidades</h1>

<div class="container">

<div class="flashcard" id="flashcard">

<div class="frente">
<h2>Curiosidade</h2>
<p id="pergunta"></p>
<small>Clique para revelar</small>
</div>

<div class="verso">
<h2>Resposta</h2>
<p id="resposta"></p>
<small>Clique para voltar</small>
</div>

</div>

<button onclick="proximoCard()">Nova Curiosidade</button>

</div>

<script src="script.js"></script>

</body>
</html>
