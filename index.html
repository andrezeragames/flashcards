<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Cards de Curiosidades</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🧠 Flash Cards de Curiosidades</h1>
    <p>Clique no cartão para descobrir a resposta.</p>
</header>

<main>

<div id="card" class="card">

    <div class="front">
        Clique em "Próximo"
    </div>

    <div class="back">
        Resposta
    </div>

</div>

<div class="buttons">
    <button onclick="flipCard()">Virar</button>
    <button onclick="nextCard()">Próximo</button>
</div>

<p id="counter"></p>

</main>

<script src="script.js"></script>

</body>
</html>
